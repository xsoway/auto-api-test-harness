[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-api-test-harness"
version = "0.1.0"
description = "pytest + LLM assistant + OpenAI-SDK agent API test harness"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "ah" }]
license = { text = "MIT" }
dependencies = [
    "pytest>=8",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jmespath>=1.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "jinja2>=3.1",
]
llm = [
    "openai>=2",
    "tiktoken>=0.7",
]
trace = [
    "langfuse>=2",
    "opentelemetry-api>=1.20",
]
prop = [
    "hypothesis>=6.0",
]
all = [
    "pytest>=8",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
    "jinja2>=3.1",
    "openai>=2",
    "tiktoken>=0.7",
    "langfuse>=2",
    "opentelemetry-api>=1.20",
    "hypothesis>=6.0",
]

[project.entry-points.pytest11]
ah = "ah.core.plugin"

[project.scripts]
ah = "ah.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ah = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
